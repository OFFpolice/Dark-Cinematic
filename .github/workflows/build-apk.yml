name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
            git add gradle/wrapper/ gradlew gradlew.bat
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"
            git commit -m "Add Gradle Wrapper" || true
            git push || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore (if missing)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Debug,C=US"
          fi

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/live-wallpaper-debug.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-wallpaper-debug
          path: app/build/outputs/apk/debug/live-wallpaper-debug.apk
          retention-days: 30
